name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build web demo
        run: ./gradlew :appWeb:jsBrowserDistribution

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs, Material, and mike
        run: pip install mkdocs-material mike

      - name: Publish docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            mike deploy --push "${GITHUB_REF_NAME%.*}"
            mike set-default --push "${GITHUB_REF_NAME%.*}"
          else
            version=$(sed -n 's/^peekniko = "\(.*\)"/\1/p' gradle/libs.versions.toml)
            if [ -z "$version" ]; then
              echo "::error::Could not read the peekniko version from gradle/libs.versions.toml"
              exit 1
            fi
            # Remove all snapshot versions; pushed together with the deploy below
            mike list | grep -- '-SNAPSHOT$' | xargs -r mike delete
            mike deploy --push "$version-SNAPSHOT"
          fi
