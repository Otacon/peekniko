name: Check PRs

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            tasks: >-
              dependencyGuard
              compileAndroidMain
              :appAndroid:compileDebugKotlin
              :appAndroid:compileReleaseKotlin
              testAndroidHostTest
          - target: Desktop
            os: ubuntu-latest
            tasks: >-
              compileKotlinJvm
              jvmTest
          - target: Web
            os: ubuntu-latest
            tasks: >-
              compileKotlinJs
              compileKotlinWasmJs
              :library:jsBrowserTest
              :library:wasmJsBrowserTest
          - target: iOS
            os: macos-latest
            tasks: >-
              compileKotlinIosArm64
              :app:linkDebugFrameworkIosSimulatorArm64
              iosSimulatorArm64Test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        if: matrix.target == 'Android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build and test
        run: ./gradlew ${{ matrix.tasks }}

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Check every target passed
        run: test "${{ needs.build.result }}" = "success"
