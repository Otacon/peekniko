name: Check PRs

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Guard library runtime dependencies
        run: ./gradlew dependencyGuard

      - name: Build
        run: >-
          ./gradlew
          :appAndroid:compileDebugKotlin
          :appAndroid:compileReleaseKotlin
          :appDesktop:compileKotlinJvm
          :app:compileAndroidMain
          :app:compileKotlinJvm
          :library:compileAndroidMain
          :library:compileKotlinJvm
          :library-client-ktor:compileAndroidMain
          :library-client-ktor:compileKotlinJvm
          :library-client-okhttp:compileAndroidMain
          :library-client-okhttp:compileKotlinJvm
          :library-client-noop:compileAndroidMain
          :library-client-noop:compileKotlinJvm
          :library-storage-sqldelight:compileAndroidMain
          :library-storage-sqldelight:compileKotlinJvm

      - name: Check debug/release API parity
        run: ./gradlew :appAndroid:compileDebugKotlin :appAndroid:compileReleaseKotlin

      - name: Run JVM unit tests
        run: >-
          ./gradlew
          :library:jvmTest
          :library-client-ktor:jvmTest
          :library-client-okhttp:jvmTest
          :library-client-noop:jvmTest
          :library-storage-sqldelight:jvmTest

      - name: Run Android unit tests
        run: >-
          ./gradlew
          :library:testAndroidHostTest
          :library-client-ktor:testAndroidHostTest
          :library-client-okhttp:testAndroidHostTest
          :library-storage-sqldelight:testAndroidHostTest
