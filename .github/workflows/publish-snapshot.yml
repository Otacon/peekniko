name: Publish snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew \
            :library-client-noop:assemble \
            :library-client-ktor:assemble \
            :library-client-okhttp:assemble \
            :library-storage-sqldelight:assemble \
            -x :library-client-noop:linkDebugFrameworkIosArm64 \
            -x :library-client-noop:linkDebugFrameworkIosSimulatorArm64 \
            -x :library-client-noop:linkReleaseFrameworkIosArm64 \
            -x :library-client-noop:linkReleaseFrameworkIosSimulatorArm64

      - name: Publish libraries
        run: ./gradlew publishToMavenCentral --no-parallel
