site_name: Peekniko
site_url: https://otacon.github.io/peekniko
extra:
  version:
    provider: mike
nav:
  - Web demo: demo/index.html
  - Android:
      - Getting Started: index.md
      - Client:
          - OkHttp: android/okhttp.md
          - Ktor: android/ktor.md
      - Storage:
          - SQLDelight: android/sqldelight.md
  - iOS:
      - Getting Started: ios/index.md
      - Client:
          - Ktor: ios/ktor.md
          - URLSession: ios/urlsession.md
      - Storage:
          - SQLDelight: ios/sqldelight.md
  - Desktop:
      - Getting Started: desktop/index.md
      - Client:
          - OkHttp: desktop/okhttp.md
          - Ktor: desktop/ktor.md
      - Storage:
          - SQLDelight: desktop/sqldelight.md

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: false
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

theme:
  logo: assets/peekniko-logo.svg
  favicon: assets/peekniko.svg
  name: material
  features:
    - navigation.tabs
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme)"
      color: indigo
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      color: indigo
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      color: indigo
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
